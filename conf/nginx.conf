location / {

  # Kanzo 0.4.2 has no `hosts` setting: it only answers Host: localhost or an IP,
  # and only when Origin is exactly http://<Host>. So the proxy presents itself
  # as 127.0.0.1:<port>. Cross-site protection is kept here: a request whose
  # Origin is not this site is refused. Drop this once a Kanzo release has `hosts`.
  set $origin_ok 0;
  if ($http_origin = "")                { set $origin_ok 1; }
  if ($http_origin = "https://$host")   { set $origin_ok 1; }
  if ($origin_ok = 0)                   { return 403; }

  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header Host 127.0.0.1:__PORT__;
  proxy_set_header Origin http://127.0.0.1:__PORT__;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # 0.4.2 polls /api/changes. /api/events (server-sent events) arrives in a later
  # release and must not be buffered, so keep this block.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_read_timeout 1h;

  # Image attachments
  client_max_body_size 50M;
}
